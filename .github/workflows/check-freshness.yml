name: Check archive freshness

on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest snapshot matches expected slot
        env:
          HOME_URL: https://bbc.frontpagearchive.com
          GRACE_MINUTES: "5"
        run: |
          node <<'EOF'
          const url = process.env.HOME_URL;
          const graceMin = Number(process.env.GRACE_MINUTES);

          const res = await fetch(url);
          if (!res.ok) {
            console.error(`::error::Fetch failed: ${res.status} ${res.statusText}`);
            process.exit(1);
          }
          const html = await res.text();

          const m = html.match(
            /([A-Z][a-z]+), (\d{1,2}) ([A-Z][a-z]+) (\d{4})(?: at |, )(\d{2}):(\d{2})/
          );
          if (!m) {
            console.error("::error::Could not find latest snapshot date on home page");
            process.exit(1);
          }
          const [full, , day, month, year, hh, mm] = m;

          const months = ["January","February","March","April","May","June",
                          "July","August","September","October","November","December"];
          const monthIdx = months.indexOf(month);
          if (monthIdx < 0) {
            console.error(`::error::Unrecognised month "${month}" in "${full}"`);
            process.exit(1);
          }

          const londonParts = ms => Object.fromEntries(
            new Intl.DateTimeFormat("en-GB", {
              timeZone: "Europe/London", hour12: false,
              year: "numeric", month: "2-digit", day: "2-digit",
              hour: "2-digit", minute: "2-digit",
            }).formatToParts(new Date(ms)).map(p => [p.type, p.value])
          );

          const londonWallToUtcMs = (y, mo, d, h, mi) => {
            const guess = Date.UTC(y, mo, d, h, mi);
            const p = londonParts(guess);
            const wall = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
            return guess - (wall - guess);
          };

          const displayedMs = londonWallToUtcMs(+year, monthIdx, +day, +hh, +mm);

          // Expected latest slot: most recent even London hour, backing off
          // graceMin so we don't fail on a snapshot still being indexed.
          const effective = londonParts(Date.now() - graceMin * 60 * 1000);
          const eh = +effective.hour - (+effective.hour % 2);
          const expectedMs = londonWallToUtcMs(
            +effective.year, +effective.month - 1, +effective.day, eh, 0
          );

          const pad = n => String(n).padStart(2, "0");
          const expectedLondon = `${effective.year}-${effective.month}-${effective.day} ${pad(eh)}:00`;
          console.log(`Displayed: ${full}`);
          console.log(`Expected:  ${expectedLondon} London`);

          if (displayedMs < expectedMs) {
            const missedH = Math.round((expectedMs - displayedMs) / 3600000);
            console.error(
              `::error::Displayed snapshot is ${missedH}h behind expected slot — worker may have failed`
            );
            process.exit(1);
          }
          EOF
